# pnpm 10+ 的配置文件（不再是 workspace 专属，pnpm 自己的设置也读这里）。
#
# 只声明一件事：哪些依赖允许执行 build script。pnpm 11 默认拒绝执行它们，并且只要有
# 一条被忽略就让 `pnpm install` 以 ERR_PNPM_IGNORED_BUILDS 退出 1；更麻烦的是
# `pnpm run` 之前的那次依赖检查会**再跑一次 install**（`verify-deps-before-run` 的
# 默认值是 `install`），命令行上的 `--config.strict-dep-builds=false` 传不进那一次，
# 于是 `pnpm test` / `pnpm build:icon` 也会跟着失败。所以必须在这里显式允许。
#
# 这三个包都不影响构建产物：esbuild 与 @parcel/watcher 是 vite / vitest 的依赖（它们的
# 平台二进制由 optional dependency 提供，不靠 postinstall），simple-git-hooks 只负责装
# 钩子。留空会让所有 pnpm 命令都跑不下去。
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true
