# coturn 最小配置示例（配合 docker-compose.coturn.yml 使用）。
#
# 两个硬性提醒：
#   1. TURN 建议同时开 UDP 与 TCP/443：部分运营商 / 企业网封 UDP，此时只有
#      TCP 或 TLS 通道能连上。
#   2. coturn 的 TLS 证书要单独配（Caddy 只管 HTTP/WS，不会顺手把 TURN 的证书
#      签好）。配 TLS 时把 cert / pkey 指向证书文件，并对外映射 5349。

listening-port=3478
tls-listening-port=5349

# 公网地址（换成你的域名或公网 IP）
external-ip=cat.example.com
realm=cat.example.com
server-name=cat.example.com

# 固定双人：一对静态凭据就够。下面的密码是占位符，上线前必须换掉，
# 而且换过之后的真实配置不要写进仓库（本文件只提交占位符）。
lt-cred-mech
user=bongo:CHANGE_ME

fingerprint
no-cli
no-tlsv1
no-tlsv1_1

# 端口范围给得越小越省资源，两个人用不着大范围
min-port=49160
max-port=49200
