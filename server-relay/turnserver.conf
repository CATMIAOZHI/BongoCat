# coturn 最小配置示例（配合 docker-compose.coturn.yml 使用）。
#
# 硬性提醒：
#   1. 要放行的端口：3478/UDP + 3478/TCP（本文件里的 listening-port）、
#      5349/TCP（配了证书才有意义）、以及下面 min-port~max-port 那一段 UDP。
#      只开 3478 而忘了中继端口段，日志看着正常、打洞却一直失败。
#      部分运营商 / 企业网封 UDP，所以 TCP 那两条也要开。
#   2. coturn 的 TLS 证书要单独配（Caddy 只管 HTTP/WS，不会顺手把 TURN 的证书
#      签好）。配 TLS 时把 cert / pkey 指向证书文件。
#   3. 下面的静态凭据**只在「服务器密码」这一层已经挡住陌生人的前提下**才够用：
#      `server.welcome` 里的 iceServers 只广告给通过服务器密码的连接（R36），
#      所以拿到这串 user= 的人已经是你们自己人。真要更硬，可以改用
#      `use-auth-secret` + 限时凭据（那样泄漏的凭据会自己过期），但中继需要
#      改造成按会话签发 HMAC 凭据，属于下一步的事。

listening-port=3478
tls-listening-port=5349

# 公网地址：**写公网 IP 字面量**（官方只支持 IP）。写域名其实会被解析一次，但解析到
# CDN 边缘 IP 或解析失败（那样 `external-ip` 会被清空，报出去的是内网地址）都会坏，所以别写域名。云主机在 NAT 后面时
# 写成 `<公网IP>/<内网IP>`。
external-ip=203.0.113.10
realm=cat.example.com
server-name=cat.example.com

# 一对静态凭据。下面的密码是占位符，上线前必须换掉，
# 而且换过之后的真实配置不要写进仓库（本文件只提交占位符）。
lt-cred-mech
user=bongo:CHANGE_ME

# 配额：全服务器只有这一张静态凭据（iceServers 是整台服务器统一广告的，没法按组发
# 不同的凭据），所以这几个数是**所有组共用**的额度，不是每组的额度：
# 每一组双人会话大约占 2 个 TURN 分配（每台设备一条 PeerConnection），默认 20 组 ≈ 40 个，
# 这里再多留约六成余量给到 64；全机的 128 用来兜住「异常退出后还没过期的分配」。
# 给太小会让「双方都在大内网、只能靠 TURN」的那几组拿不到分配（日志正常、打洞失败），
# 这才是这几个数真正的天花板；要更硬应该改成 use-auth-secret + 限时凭据（见上面第 3 条）。
user-quota=64
total-quota=128
max-bps=1048576

# 禁止把流量中转到内网、回环、链路本地与云元数据地址（169.254.169.254 那类）。
# coturn 用的是 host 网络，没有这几行就等于给别人一个打内网的跳板。
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

fingerprint

# 中继端口范围：默认 20 组时约 40 个分配同时在线，留一倍余量（连接异常退出后分配
# 会滞留到 lifetime 到期）。这一段 UDP 也要在安全组/防火墙放行。
min-port=49160
max-port=49260
