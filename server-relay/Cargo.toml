[package]
name = "bongocat-pair-relay"
version = "0.1.0"
edition = "2021"
publish = false
description = "Self-hosted BongoCat pair relay: one instance serves many two-device pair sessions"

# 这个 crate 独立于仓库根目录的 workspace（根 workspace 只包含 src-tauri）。
# 没有这张表时，cargo 会因为「目录在工作区里但不是成员」而拒绝编译。
[workspace]

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
hkdf = "0.13.0"
# 限时 TURN 凭据（coturn 的 REST API）要的那一份：`base64(HMAC-SHA1(secret, username))`。
# 这两条只用来**签一份有时限的授权**，不做任何机密性保护（共享密钥本身是高熵的随机串）。
hmac = "0.13.0"
rand = "0.10.3"
sha1 = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
# `#[tokio::test(start_paused = true)]`（把虚拟时钟直接推到定时器）需要 test-util
tokio = { version = "1.53.1", features = ["test-util"] }
