# 裸 IP 模式：不套 Caddy，直接暴露 :8080。
#
#   docker compose -f docker-compose.direct.yml up -d
#
# 适合临时测试、内网、以及本来就不想折腾证书的个人服务器。
#
# ⚠️ 没有 TLS：客户端与服务器之间的握手与信令（WebSocket 头、上下线控制帧）是明文，
#    只有聊天、附件与桌宠状态本身仍然是端到端加密的（E2EE，服务器解不开）。
#    客户端在填了明文地址时也会显示一条同样的提醒。
#
# 客户端填法：服务器地址填 <公网 IP>:8080（不带 scheme，客户端会按 ws:// 处理）。
# 别忘了在云控制台的安全组里放行 **TCP 8080**（否则容器起来了客户端也连不上）
# 与 **UDP 3479**（内置 STUN，不放行的话 P2P 直连打不通，只能走服务器转发）。

services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      PAIR_LISTEN: ${PAIR_LISTEN:-0.0.0.0:8080}
      # 必填（R36）：同 docker-compose.yml，客户端要填同一个值
      PAIR_SERVER_PASSWORD: ${PAIR_SERVER_PASSWORD:?请先在 .env 里设置 PAIR_SERVER_PASSWORD}
      PAIR_MAX_SESSIONS: ${PAIR_MAX_SESSIONS:-20}
      # 客户端按广告值的 2/3 推导**帧**速率：广告 90 → 客户端 60
      PAIR_MAX_FRAMES_PER_SECOND: ${PAIR_MAX_FRAMES_PER_SECOND:-90}
      # 这几项必须在这里透传（写进 .env 是给 compose 做替换用的，容器不读 .env 文件本身）
      PAIR_MAX_CHUNKS_PER_SECOND: ${PAIR_MAX_CHUNKS_PER_SECOND:-}
      PAIR_MAX_BYTES_PER_SECOND: ${PAIR_MAX_BYTES_PER_SECOND:-}
      PAIR_STALE_AFTER_MS: ${PAIR_STALE_AFTER_MS:-}
      # 内置 STUN（同 docker-compose.yml）：要设成 0 关闭，必须先注释掉下面 `ports` 里
      # 那行 udp，否则 `0:0/udp` 会让 compose 起不来
      PAIR_STUN_PORT: ${PAIR_STUN_PORT:-3479}
      PAIR_ICE_SERVERS: ${PAIR_ICE_SERVERS:-}
      # 公益档（可选）：同 docker-compose.yml。direct 模式下对端就是客户端本身，
      # 所以 PAIR_TRUST_PROXY 默认**关闭**（这里没有反代，开了只会让任何人伪造 XFF）
      PAIR_PUBLIC_SERVER_PASSWORD: ${PAIR_PUBLIC_SERVER_PASSWORD:-}
      PAIR_MAX_PUBLIC_SESSIONS: ${PAIR_MAX_PUBLIC_SESSIONS:-}
      PAIR_MAX_PUBLIC_PER_IP: ${PAIR_MAX_PUBLIC_PER_IP:-}
      PAIR_PUBLIC_MAX_FRAMES_PER_SECOND: ${PAIR_PUBLIC_MAX_FRAMES_PER_SECOND:-}
      PAIR_PUBLIC_MAX_BYTES_PER_SECOND: ${PAIR_PUBLIC_MAX_BYTES_PER_SECOND:-}
      PAIR_PUBLIC_WINDOW_SECS: ${PAIR_PUBLIC_WINDOW_SECS:-}
      # 这里**写死 0**（不用 `${...:-0}`）：两种模式常常共用一份 `.env`，而域名模式那一份
      # 建议打开它（`PAIR_TRUST_PROXY=1`）。direct 模式把 8080 直接发布到公网，没有反代，
      # 打开就等于让**私网**对端伪造 `X-Forwarded-For` 绕过公益档的「每 IP 几组」限额。
      PAIR_TRUST_PROXY: 0
    ports:
      - '8080:8080'
      - '${PAIR_STUN_PORT:-3479}:${PAIR_STUN_PORT:-3479}/udp'
    healthcheck:
      test: [CMD, bongocat-pair-relay, --health-check]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
