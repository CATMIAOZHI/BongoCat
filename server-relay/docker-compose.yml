# 推荐模式：域名 + Caddy 自动 HTTPS。
#
# 一套服务器同时承载 PAIR_MAX_SESSIONS 个双人会话，服务器本身**没有**联机密钥。
#
# 用法：
#   1. cp .env.example .env，填 PAIR_DOMAIN=<你的域名>
#   2. docker compose up -d
#   3. 客户端双方都填 https://<你的域名> 与同一个「联机密钥」

services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      PAIR_LISTEN: 0.0.0.0:8080
      PAIR_MAX_SESSIONS: ${PAIR_MAX_SESSIONS:-20}
      # 想放开额度（例如为了 60Hz）时改这三行；不给就是 CF 的 30 / 20 / 12MiB。
      # 客户端按 2/3 推导自己的速率：广告 90 → 客户端 60。
      PAIR_MAX_FRAMES_PER_SECOND: ${PAIR_MAX_FRAMES_PER_SECOND:-90}
      # PAIR_MAX_CHUNKS_PER_SECOND: "20"
      # PAIR_MAX_BYTES_PER_SECOND: "12582912"
      # 自建 coturn 后把地址广告给客户端（见 docker-compose.coturn.yml）
      # PAIR_ICE_SERVERS: '[{"urls":["stun:cat.example.com:3478"]}]'
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      PAIR_DOMAIN: ${PAIR_DOMAIN:?请先在 .env 里设置 PAIR_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
