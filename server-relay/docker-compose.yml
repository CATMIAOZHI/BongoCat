# 推荐模式：域名 + Caddy 自动 HTTPS。
#
# 一套服务器同时承载 PAIR_MAX_SESSIONS 个双人会话，服务器本身**没有**配对密码。
#
# 用法：
#   1. cp .env.example .env，填 PAIR_DOMAIN=<你的域名> 与
#      PAIR_SERVER_PASSWORD=<服务器密码>（缺任一个都会明确报错，不会半启动）
#      ——服务器密码先生成好再 cp 更省事：`cargo run --release --bin generate-pair -- --server`
#   2. 云控制台的安全组放行 TCP 80、TCP 443 与 UDP 3479（Caddy 要用 80 申请证书；
#      UDP 3479 是内置 STUN，不放行的话 P2P 直连打不通，只能走服务器转发），
#      域名 A 记录指向这台机器
#   3. docker compose up -d
#   4. 自查：curl https://<你的域名>/health 应当打印
#      {"ok":true,"protocol":1,"mode":"multi-pair","passwordRequired":true,"publicTier":false,
#       "serverKeys":{"full":1,"public":0}}（`publicTier` / `serverKeys` 看你配了什么）
#   5. 把「服务器地址（https://<你的域名>）+ 服务器密码 + 配对密码」三个值一起发给对方，
#      两边客户端都填这三项
#
# 改过 .env 之后要重新 `docker compose up -d` 才会生效：`docker compose restart`
# **不会**重读 .env（换服务器密码时最容易踩这一下）。

services:
  relay:
    build: .
    restart: unless-stopped
    # 日志上限是**默认就带上**的（不用自己加）：不设它时 docker 的 json-file 驱动会一路
    # 写下去，而中继每来一次错误密码、每建一个会话都会打一行——被人拿错密码刷 /ws 时
    # 能把宿主机磁盘写满。10MB × 3 个文件 = 中继最多占 30MB（平稳时约一个月一轮换；
    # 被刷的时候也只占这么多）。改这里之后要 `docker compose up -d` 重建容器才生效：
    # `restart` 不会应用新的 logging 配置。
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      PAIR_LISTEN: ${PAIR_LISTEN:-0.0.0.0:8080}
      # 必填（R36）：决定「谁能用这台服务器」。客户端要填同一个值才连得上
      PAIR_SERVER_PASSWORD: ${PAIR_SERVER_PASSWORD:?请先在 .env 里设置 PAIR_SERVER_PASSWORD}
      PAIR_MAX_SESSIONS: ${PAIR_MAX_SESSIONS:-20}
      # 想放开额度（例如为了 60Hz）时改这几行；不给就是 CF 的 30 / 20 / 12MiB。
      # 客户端按广告值的 2/3 推导**帧**速率：广告 90 → 客户端 60；分片那一路是 3/4。
      PAIR_MAX_FRAMES_PER_SECOND: ${PAIR_MAX_FRAMES_PER_SECOND:-90}
      # 这几项**必须在这里透传**：写进 `.env` 是给 compose 做替换用的，容器不会自己去读
      # `.env`——少一行就是「改了 .env 却完全没生效」。留空时用二进制里的默认值。
      PAIR_MAX_CHUNKS_PER_SECOND: ${PAIR_MAX_CHUNKS_PER_SECOND:-}
      PAIR_MAX_BYTES_PER_SECOND: ${PAIR_MAX_BYTES_PER_SECOND:-}
      PAIR_STALE_AFTER_MS: ${PAIR_STALE_AFTER_MS:-}
      # 内置 STUN 的 UDP 端口（告诉客户端它的公网地址，P2P 直连要用）。默认 3479；
      # 改端口时下面 `ports` 那行会跟着变。要设成 0 关闭，必须先注释掉下面 `ports`
      # 那行，否则 `0:0/udp` 会让 compose 起不来
      PAIR_STUN_PORT: ${PAIR_STUN_PORT:-3479}
      # 自建 coturn 后把地址填在 .env 的 PAIR_ICE_SERVERS 里（coturn 本体见
      # docker-compose.coturn.yml）。填了它就以它为准，内置 STUN 不启动；空值时用内置的
      PAIR_ICE_SERVERS: ${PAIR_ICE_SERVERS:-}
      # 公益档（可选）：设了公益密码，别人就能拿它借这台服务器打洞（只转发信令、
      # 不中继数据、不广告 TURN），名额与额度都算自己的、占不到上面那一档。
      # 留空 = 没有公益档。密码 ≥ 16 字符，且**不能**和 PAIR_SERVER_PASSWORD 相同。
      # 两个密码变量都能写多把（`;` 分隔），每把各给一个人；同一把不能跨档。
      PAIR_PUBLIC_SERVER_PASSWORD: ${PAIR_PUBLIC_SERVER_PASSWORD:-}
      PAIR_MAX_PUBLIC_SESSIONS: ${PAIR_MAX_PUBLIC_SESSIONS:-}
      PAIR_MAX_PUBLIC_PER_IP: ${PAIR_MAX_PUBLIC_PER_IP:-}
      PAIR_PUBLIC_MAX_FRAMES_PER_SECOND: ${PAIR_PUBLIC_MAX_FRAMES_PER_SECOND:-}
      PAIR_PUBLIC_MAX_BYTES_PER_SECOND: ${PAIR_PUBLIC_MAX_BYTES_PER_SECOND:-}
      # 突发容量（一次能发多少）：一轮打洞要能一口气发完，所以它比上面那两份额度大
      PAIR_PUBLIC_BURST_FRAMES: ${PAIR_PUBLIC_BURST_FRAMES:-}
      PAIR_PUBLIC_BURST_BYTES: ${PAIR_PUBLIC_BURST_BYTES:-}
      # 每把公益钥匙的滚动预算（16 MiB 一次性 + 每小时回填）：按连接的额度拦不住
      # 「十组名额各自贴着上限」，所以再加一层；记账挂钥匙而不是连接 / 房间 / IP
      PAIR_PUBLIC_KEY_BUDGET_BYTES: ${PAIR_PUBLIC_KEY_BUDGET_BYTES:-}
      PAIR_PUBLIC_WINDOW_SECS: ${PAIR_PUBLIC_WINDOW_SECS:-}
      # 完全档（你自己那一档）也有护栏：每把钥匙最多几组会话、空闲多久回收、以及每把钥匙的
      # 滚动预算（2 GiB 一次性 + 每小时回填）。它们不影响正常使用，决定的是「一把钥匙流出去
      # 之后最坏能怎样」。留空都用二进制里的缺省值；写 0 表示关掉那一层。
      PAIR_MAX_SESSIONS_PER_KEY: ${PAIR_MAX_SESSIONS_PER_KEY:-}
      PAIR_FULL_WINDOW_SECS: ${PAIR_FULL_WINDOW_SECS:-}
      PAIR_FULL_KEY_BUDGET_BYTES: ${PAIR_FULL_KEY_BUDGET_BYTES:-}
      # 限时 TURN 凭据：填了它，welcome 里的 turn 凭据就按每次连接现签、限时有效。
      # 必须和 coturn 的 static-auth-secret 写同一个值（见 README 的「可选：TURN」）。
      # 留空 = 用 PAIR_ICE_SERVERS 里那份静态凭据（旧行为，凭据长期有效）
      PAIR_TURN_SECRET: ${PAIR_TURN_SECRET:-}
      PAIR_TURN_TTL_SECS: ${PAIR_TURN_TTL_SECS:-}
      # 每 IP 每分钟允许几次握手**失败**（超过就 429，并且不再写日志）。它跟公益档无关，
      # 是你自己那一档的护栏：拿错密码刷 /ws 的代价本来只是一次摘要比较，能被打爆的是日志
      PAIR_HANDSHAKE_FAILURES_PER_MINUTE: ${PAIR_HANDSHAKE_FAILURES_PER_MINUTE:-}
      # 只在前面站着可信反代（这一份就是 Caddy）时打开，否则每 IP 限额会把所有公益
      # 连接算成同一个 IP（127.0.0.1）。direct 模式对端就是客户端本身，不要开
      PAIR_TRUST_PROXY: ${PAIR_TRUST_PROXY:-1}
    expose:
      - '8080'
    # 内置 STUN 直接对外（Caddy 只管 HTTP，不转 UDP）。宿主端口与容器端口必须一样：
    # 中继广告给客户端的就是这个端口号
    ports:
      - '${PAIR_STUN_PORT:-3479}:${PAIR_STUN_PORT:-3479}/udp'
    # 让 `docker compose ps` 能看出中继到底在不在服务，也让 Caddy 等到它就绪
    healthcheck:
      test: [CMD, bongocat-pair-relay, --health-check]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

  caddy:
    image: caddy:2
    restart: unless-stopped
    # 同 relay：Caddy 的访问日志与 ACME 重试也会一直写盘，这里给它一份同样的上限
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      relay:
        condition: service_healthy
    environment:
      PAIR_DOMAIN: ${PAIR_DOMAIN:?请先在 .env 里设置 PAIR_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
