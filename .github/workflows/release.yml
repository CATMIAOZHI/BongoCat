name: BongoCat Release

# 本 fork 自用：推 `v*` 标签（或手动 Run workflow）就能在本仓库出安装包，
# **不需要配任何 Secret**。与上游的三处不同都为此：
#   1. `secrets.RELEASE_TOKEN` → `secrets.GITHUB_TOKEN`（上游用的是作者自己的 PAT；
#      fork 里没有那个 Secret，第一个 job 直接失败，而后面依赖它）。自带令牌的权限
#      由下面的 `permissions` 给，job 结束即失效，不用维护 PAT。
#   2. `--no-sign`：本仓库自用不发布自动更新，不需要 updater 签名；而
#      `tauri.conf.json` 里 `createUpdaterArtifacts: true` 时缺
#      `TAURI_SIGNING_PRIVATE_KEY` 会让打包报错（「A public key has been found,
#      but no private key」）。
#   3. `uploadUpdaterJson: false`：没有签名就不生成 `latest.json`
#      （这是 tauri-action 现在的 input 名，上游的 `includeUpdaterJson` 早就改名了）。
# 想恢复「签名 + 自动更新分发」，见文件末尾的说明。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 自带令牌需要显式授权，否则无法建 Release / 传附件
permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate changelog
        id: create_release
        run: npx changelogithub --draft --name ${{ steps.vars.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-app:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-latest
            target: i686-pc-windows-msvc
          - platform: windows-latest
            target: aarch64-pc-windows-msvc

          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          # libasound2-dev / pkg-config：语音录音用的 cpal 在 Linux 上经 alsa-sys 链接 ALSA
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev patchelf xdg-utils pkg-config libasound2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: target

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install front-end dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          CI: false
          PLATFORM: ${{ matrix.platform }}
          # 自用版不签名，所以这里**不读** TAURI_SIGNING_PRIVATE_KEY：
          # 空值的同名变量反而会让签名那一步报错
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          # 上游这里引用的是 changelogithub 的 `APP_VERSION` 输出，而它并不存在
          # （标题会变成「BongoCat 」）；自用版直接用标签名
          releaseName: BongoCat ${{ github.ref_name }}
          releaseBody: ''
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --no-sign

# 以后想恢复「安装包 + 自动更新」的完整分发（四步）：
#   1. 生成本仓库自用的密钥对：`pnpm tauri signer generate -w $HOME/.tauri/bongocat.key`
#   2. 把生成的**公钥**填进 `src-tauri/tauri.conf.json` 的 `plugins.updater.pubkey`
#      （现在是上游的公钥，与自己的私钥不匹配，tauri 会直接拒绝）
#   3. 在仓库 Settings → Secrets 里加 `TAURI_SIGNING_PRIVATE_KEY`（私钥文件内容）
#      与 `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`（私钥没设密码就留空）
#   4. 去掉上面的 `--no-sign`、把 `uploadUpdaterJson` 改回 `true`，
#      并把 `plugins.updater.endpoints` 指向本仓库的
#      `releases/latest/download/latest.json`（现在指的是上游，装了这个包会拉到上游版本）
