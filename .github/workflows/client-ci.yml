name: Client CI

# 客户端（Vue + src-tauri）的编译与测试门禁。仓库此前只有 release.yml，它只在打
# `v*` tag 时 `pnpm tauri build`，会编译但一条测试都不跑；Phase 8 要动会话主循环和
# 传输层，没有 PR 级的门禁很难受（R24-2）。server-relay/ 那一份在 pair-relay.yml。
#
# paths 里不放 vite.config.ts / uno.config.ts：这两步都不读它们（vitest 只读
# vitest.config.ts），放进去只会多触发。vite build 与 eslint 不在这个门禁的范围内。
on:
  push:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      # rust job 的 Generate icons 直接执行 scripts/；pnpm-workspace.yaml 决定 Install 能否成功
      - 'scripts/**'
      - pnpm-workspace.yaml
      - Cargo.toml
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
      - 'tsconfig*.json'
      - vitest.config.ts
      - .github/workflows/client-ci.yml
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - pnpm-workspace.yaml
      - Cargo.toml
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
      - 'tsconfig*.json'
      - vitest.config.ts
      - .github/workflows/client-ci.yml
  workflow_dispatch:

# 两个 job 都只读仓库
permissions:
  contents: read

jobs:
  rust:
    # 放 Windows runner：release.yml 的 ubuntu 任务要先装 libwebkit2gtk-4.1-dev /
    # libappindicator3-dev / librsvg2-dev / libudev-dev / patchelf / libasound2-dev
    # 才编得过 cpal / rdev / gilrs，Windows 一个系统依赖都不用装。而且 #[cfg(windows)]
    # 的 P2P 代码只在 Windows 编译，放 Linux 等于它根本没有门禁。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # pnpm 11 要求 Node >= 22.13（它用了 node:sqlite，Node 20 上连 `pnpm -v` 都崩）
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 普通 install 就行：仓库根有 pnpm-workspace.yaml，里面 allowBuilds 把 pnpm 11
      # 默认拦下的三个 build script 显式放开了，否则 `pnpm install` 会以
      # ERR_PNPM_IGNORED_BUILDS 退出 1，而 `pnpm run` 前的那次依赖检查会再触发一遍、
      # 让后面的步骤也一起红（本机复现过）。
      - name: Install
        run: pnpm install --frozen-lockfile

      # 生成图标这一步看着多余，其实是必需的：tauri-build 在 Windows 上要拿
      # `icons/icon.ico` 生成 Windows 资源文件，而 `src-tauri/icons` **不入库**
      # （`src-tauri/.gitignore` 里就写着 icons），干净检出上直接 `cargo test` 会报
      # "icons/icon.ico not found"。release.yml 是走 `pnpm tauri build` 的
      # beforeBuildCommand（= `pnpm build`，其中包含 build:icon）顺带生成的，
      # 这里必须显式走同一步。图标由 `src-tauri/assets/logo.png` 生成，那张图入库。
      - name: Generate icons
        run: pnpm build:icon

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # tauri lib 的 target 目录很大，用专门的 rust-cache 而不是裸 actions/cache
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      # 不跑 cargo fmt --check：仓库里有既有的 rustfmt 差异，它现在一定是红的，
      # 先把「测试能过」这件事挡住比顺手格式化整个仓库重要。
      - name: Test
        run: cargo test --lib

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # 同上：pnpm 11 需要 Node >= 22.13
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # vite build 不做类型检查，仓库也没装 vue-tsc，所以单独跑一次 tsc（只覆盖 .ts）
      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit
