[package]
name = "bongo-cat"
version = "1.2.0"
description = "A Tauri App"
authors = [ "ayangweb" ]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bongo_cat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true, features = ["tray-icon", "protocol-asset", "macos-private-api", "image-png"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tauri-plugin-custom-window.workspace = true
tauri-plugin-admin-status.workspace = true
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-pinia = "3"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-prevent-default = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-macos-permissions = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
fs_extra = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-locale = "2"
rdev = { git = "https://github.com/kunkunsh/rdev" }
gilrs = { git = "https://github.com/ayangweb/gilrs", default-features = false, features = ["xinput"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
hkdf = "0.13.0"
sha2 = "0.11.0"
chacha20poly1305 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.3"
uuid = { version = "1.26.1", features = ["v4"] }
keyring = "4.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
cpal = "0.18.2"
hound = "3.5.1"

[target."cfg(target_os = \"macos\")".dependencies]
tauri-nspanel.workspace = true

# P2P（WebRTC）只在 Windows 上编译。Phase 8 的范围就是 Windows 客户端，所以非
# Windows 的 4 个 release 目标完全不碰这棵依赖树（净新增 41 个 crate；需要 C 工具链
# 的 ring 本来就在树里，没有新增构建工具要求），构建风险面从 7 个目标降到 3 个。
# 调用点不要在这里散写 cfg：见 src/core/pair/link.rs 那层 cfg 中立的 seam。
[target."cfg(windows)".dependencies]
webrtc.workspace = true
async-trait.workspace = true
# `DataChannel::send` 收的是 `BytesMut`。这个 crate 本来就在依赖树里（tungstenite），
# 只是之前没有直接用到。
bytes = "1"
# 「按键安静了很久 ≠ 已经抬起」那道判断要问操作系统（`GetAsyncKeyState`，见
# `core/device.rs` 的 `is_key_down`）。版本与 rdev 用的 winapi 一致，只是把它已经带进来的
# `winuser` 直接引出来，不新增依赖、不新增构建。
winapi = { version = "0.3", features = ["winuser"] }

[features]
cargo-clippy = []
